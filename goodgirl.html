<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Good Girl 💗</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* Pink background */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:#a94d69;
    z-index:-2;
}

/* Paper */

.card{
    position:relative;

    width:94%;
    max-width:600px;
    height:650px;

    background-color:#fffdf3;

    background-image:
        linear-gradient(#dedbd0 1px,transparent 1px),
        linear-gradient(90deg,#dedbd0 1px,transparent 1px);

    background-size:28px 28px;

    border-radius:90px 25px 90px 25px;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding-top:45px;

    overflow:hidden;

    box-shadow:0 0 35px rgba(255,255,255,.2);

    animation:cardIn 1s ease;
}

/* Dog */

.dog{
    font-size:145px;

    margin-top:15px;

    animation:
        dogBounce 2s ease-in-out infinite;
}

/* Good text */

.goodText{
    margin-top:5px;

    font-family:cursive;

    font-size:43px;
    font-weight:bold;

    color:#963c58;

    text-align:center;

    text-shadow:1px 1px white;

    animation:fadeUp 1s ease;
}

/* Sunflower */

.flower{
    position:absolute;

    right:30px;
    bottom:100px;

    font-size:65px;

    animation:flowerFloat 2s ease-in-out infinite;
}

/* Click button */

button{
    margin-top:35px;

    width:220px;

    padding:17px;

    border:none;

    border-radius:50px;

    background:#b65b79;

    color:white;

    font-family:Georgia,serif;

    font-size:32px;

    text-decoration:underline;

    cursor:pointer;

    box-shadow:
        0 5px 0 #803a52,
        0 10px 20px rgba(0,0,0,.15);

    transition:.2s;

    animation:fadeUp 1.4s ease;
}

button:hover{
    transform:translateY(-5px) scale(1.04);
}

button:active{
    transform:translateY(4px);

    box-shadow:0 2px 0 #803a52;
}

/* Animations */

@keyframes cardIn{

    from{
        opacity:0;
        transform:scale(.75) rotate(-5deg);
    }

    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }

}

@keyframes dogBounce{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }

}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes flowerFloat{

    0%,100%{
        transform:rotate(-5deg) translateY(0);
    }

    50%{
        transform:rotate(5deg) translateY(-8px);
    }

}

/* Mobile */

@media(max-width:500px){

    .card{
        height:600px;
    }

    .dog{
        font-size:110px;
    }

    .goodText{
        font-size:34px;
    }

    .flower{
        font-size:50px;
        right:20px;
    }

    button{
        width:190px;
        font-size:28px;
    }

}

</style>

</head>


<body>

<div class="card">

    <!-- Cute dog -->
    <div class="dog">
        🧸🌹
    </div>

    <!-- Text -->
    <div class="goodText">
        Psst… I Have Something for You 🤫💗
Just a tiny little thing… maybe.!
    </div>

    <!-- Sunflower -->
    <div class="flower">
        🌻
    </div>

    <!-- Click -->
    <button onclick="nextPage()">
        Click here to see
    </button>

</div>


<script>

function nextPage(){

    // Yahan apne next webpage ka naam likhna
    window.location.href="1index.html";

}

</script>

</body>

</html>
