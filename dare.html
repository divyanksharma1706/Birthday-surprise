<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>How Dare You 😤</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    font-family:Arial,sans-serif;
}


/* Pink background */

body::before{
    content:"";

    position:fixed;

    inset:0;

    background:#a94d69;

    z-index:-2;
}


/* Paper */

.card{
    position:relative;

    width:94%;
    max-width:600px;
    height:650px;

    background-color:#fffdf3;

    background-image:
        linear-gradient(#dedbd0 1px,transparent 1px),
        linear-gradient(90deg,#dedbd0 1px,transparent 1px);

    background-size:28px 28px;

    border-radius:90px 25px 90px 25px;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding-top:45px;

    overflow:hidden;

    box-shadow:
        0 0 35px rgba(255,255,255,.2);

    animation:cardIn 1s ease;
}


/* Angry dog */

.dog{
    font-size:145px;

    margin-top:15px;

    animation:angryShake .7s ease-in-out infinite;
}


/* Angry symbol */

.angry{
    position:absolute;

    top:55px;
    right:110px;

    font-size:45px;

    animation:angerPop 1s infinite;
}


/* HOW DARE YOU */

.dareText{
    margin-top:20px;

    font-size:55px;

    font-weight:900;

    color:#963c58;

    text-align:center;

    text-shadow:
        2px 2px white;

    animation:darePop .8s ease;
}


/* Go back */

button{
    margin-top:40px;

    width:220px;

    padding:17px;

    border:none;

    border-radius:50px;

    background:#b65b79;

    color:white;

    font-family:Georgia,serif;

    font-size:31px;

    text-decoration:underline;

    cursor:pointer;

    box-shadow:
        0 5px 0 #803a52,
        0 10px 20px rgba(0,0,0,.15);

    transition:.2s;
}

button:hover{
    transform:translateY(-5px) scale(1.04);
}

button:active{
    transform:translateY(4px);

    box-shadow:0 2px 0 #803a52;
}


/* Animations */

@keyframes cardIn{

    from{
        opacity:0;
        transform:scale(.75) rotate(-5deg);
    }

    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }

}


@keyframes angryShake{

    0%,100%{
        transform:translateX(0) rotate(0);
    }

    25%{
        transform:translateX(-7px) rotate(-3deg);
    }

    75%{
        transform:translateX(7px) rotate(3deg);
    }

}


@keyframes angerPop{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.3);
    }

}


@keyframes darePop{

    0%{
        opacity:0;
        transform:scale(.5);
    }

    80%{
        transform:scale(1.1);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}


/* Mobile */

@media(max-width:500px){

    .card{
        height:600px;
    }

    .dog{
        font-size:110px;
    }

    .dareText{
        font-size:42px;
    }

    .angry{
        right:70px;
        font-size:35px;
    }

    button{
        width:190px;
        font-size:28px;
    }

}

</style>

</head>


<body>

<div class="card">

    <!-- Angry cute dog -->
    <div class="dog">
        🐶😤
    </div>

    <!-- Angry sign -->
    <div class="angry">
        💢
    </div>

    <!-- Text -->
    <div class="dareText">
        HOW DARE YOU
    </div>

    <!-- Go Back -->
    <button onclick="goBack()">
        Go back
    </button>

</div>


<script>

function goBack(){

    window.location.href="index.html";

}

</script>

</body>

</html>
