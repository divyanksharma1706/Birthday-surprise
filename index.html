<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hey!! 💗</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial, sans-serif;
}


/* PINK BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:#a94d69;
    z-index:-2;
}


/* PAPER */

.card{
    position:relative;

    width:94%;
    max-width:600px;
    height:650px;

    background-color:#fffdf3;

    background-image:
        linear-gradient(#dedbd0 1px, transparent 1px),
        linear-gradient(90deg,#dedbd0 1px,transparent 1px);

    background-size:28px 28px;

    border-radius:
        90px 25px 90px 25px;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding-top:55px;

    box-shadow:
        0 0 35px rgba(255,255,255,.2);

    overflow:hidden;

    animation:cardIn 1s ease;
}


/* DOG */

.dog{
    position:absolute;

    right:25px;
    top:25px;

    font-size:125px;

    transform:rotate(5deg);

    animation:dogFloat 3s ease-in-out infinite;
}

/* HEY */

.hey{
    margin-top:70px;

    font-size:70px;

    font-weight:900;

    letter-spacing:3px;

    color:#963c58;

    text-shadow:
        3px 3px white,
        5px 5px rgba(100,30,50,.15);

    animation:heyPop 1s ease;
}


/* MESSAGE */

.message{
    margin-top:25px;

    font-family:cursive;

    font-size:31px;

    font-weight:bold;

    text-align:center;

    color:#111;

    animation:fadeUp 1.2s ease;
}


/* QUESTION */

.question{
    margin-top:5px;

    font-family:cursive;

    font-size:34px;

    color:#333;

    transform:rotate(-2deg);

    animation:fadeUp 1.4s ease;
}


/* BUTTONS */

.buttons{
    display:flex;

    gap:35px;

    margin-top:40px;

    z-index:5;

    animation:fadeUp 1.6s ease;
}


button{
    width:175px;

    padding:17px 25px;

    border:none;

    border-radius:50px;

    background:#b65b79;

    color:white;

    font-family:Georgia,serif;

    font-size:31px;

    text-decoration:underline;

    cursor:pointer;

    box-shadow:
        0 5px 0 #803a52,
        0 10px 20px rgba(0,0,0,.15);

    transition:.2s;
}


button:hover{
    transform:translateY(-5px) scale(1.04);
}


button:active{
    transform:translateY(4px);

    box-shadow:
        0 2px 0 #803a52;
}


/* ANIMATIONS */

@keyframes cardIn{

    from{
        opacity:0;
        transform:scale(.75) rotate(-5deg);
    }

    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }

}


@keyframes heyPop{

    0%{
        opacity:0;
        transform:scale(.3);
    }

    70%{
        transform:scale(1.15);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}


@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


@keyframes dogFloat{

    0%,100%{
        transform:translateY(0) rotate(5deg);
    }

    50%{
        transform:translateY(-12px) rotate(-3deg);
    }

}


/* MOBILE */

@media(max-width:500px){

    .card{
        height:600px;
    }

    .dog{
        font-size:90px;
        right:15px;
        top:30px;
    }

    .hey{
        font-size:57px;
        margin-top:65px;
    }

    .message{
        font-size:25px;
        margin-top:30px;
    }

    .question{
        font-size:28px;
    }

    .buttons{
        gap:15px;
        margin-top:35px;
    }

    button{
        width:140px;
        font-size:27px;
        padding:15px 15px;
    }

}

</style>

</head>


<body>

<div class="card">

    <!-- Cute Dog -->
    <div class="dog">🎀🌹</div>


    <!-- HEY -->
    <div class="hey">
        HEY!!
    </div>


    <!-- MESSAGE -->
    <div class="message">
        I made something for you
    </div>


    <!-- QUESTION -->
    <div class="question">
        Do you want to see?
    </div>


    <!-- BUTTONS -->
    <div class="buttons">

        <button onclick="goYes()">
            Yes
        </button>

        <button onclick="goNo()">
            No
        </button>

    </div>

</div>


<script>

function goYes(){

    window.location.href="goodgirl.html";

}


function goNo(){

    window.location.href="dare.html";

}

</script>

</body>
</html>
